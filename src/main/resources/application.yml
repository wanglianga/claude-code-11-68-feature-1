spring:
  application:
    name: clinical-fact-recon
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  recon-rule-version: recon-v1.0
  lesion-protocol:
    # 方案允许的最大层厚(mm)：随访扫描层厚超过该值即判协议越界，变化标不可比较而非进展
    max-slice-thickness-mm: 3.0
